[project]
name = "pm-arb"
version = "0.1.0"
description = "Polymarket quantitative arbitrage trading system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "websockets>=12.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "tenacity>=8.2",
    "python-dotenv>=1.0",
    "web3>=6.17",
    "py-clob-client-v2>=1.1.0",
    "huggingface-hub>=1.31.0",
    "pyarrow>=25.0.1",
]

[project.scripts]
pm-doctor = "pm_arb.app.doctor:main"
pm-setup = "pm_arb.app.setup:main"
pm-watch = "pm_arb.app.watch:main"
pm-crypto5m = "pm_arb.app.crypto5m:main"
pm-record = "pm_arb.app.record_ticks:main"
pm-redeem = "pm_arb.app.redeem:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pm_arb"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
